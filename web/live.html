<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMLP 实时会合地图</title>
  <link rel="stylesheet" href="/web/vendor/leaflet/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: calc(100vh - 56px); width: 100%; background: #ddd; }
    header {
      padding: 8px 12px; display: flex; gap: 12px; align-items: center;
      background: #1a1a2e; color: #eee; min-height: 56px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #status { font-size: 12px; color: #9ab; flex: 1; }
    .panel {
      position: absolute; top: 64px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,.96); border-radius: 8px; padding: 10px 12px;
      font-size: 12px; max-width: 280px; box-shadow: 0 2px 10px rgba(0,0,0,.15);
      max-height: calc(100vh - 120px); overflow-y: auto;
    }
    .panel h2 { margin: 0 0 8px; font-size: 13px; }
    .panel .hint { color: #666; margin: 0 0 8px; line-height: 1.4; }
    .meet-item {
      border-left: 4px solid #ccc; padding: 6px 0 6px 8px; margin-bottom: 8px;
      cursor: pointer;
    }
    .meet-item:hover { background: #f5f5f5; }
    .meet-item .title { font-weight: 600; }
    .meet-item .meta { color: #555; margin-top: 2px; }
    .veh-row { margin-bottom: 6px; padding-left: 8px; border-left: 3px solid #888; }
    /* 地图标记：须给足 iconSize，否则 Leaflet 会裁切文字 */
    .map-marker-wrap {
      background: transparent !important;
      border: none !important;
    }
    .map-marker-wrap .map-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.4));
    }
    .map-marker-wrap .map-badge-label {
      background: var(--badge-bg, #2563eb);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      border: 2px solid #fff;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .map-marker-wrap .map-badge-label--dest {
      font-size: 14px;
      padding: 7px 16px;
      border-radius: 10px;
    }
    .map-marker-wrap .map-badge-label--meet {
      font-size: 12px;
      padding: 5px 10px;
      white-space: normal;
      max-width: 160px;
    }
    .map-marker-wrap .map-badge-sub {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.95;
      margin-top: 2px;
    }
    .map-marker-wrap .map-badge-pin {
      width: 0;
      height: 0;
      margin-top: 1px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid var(--badge-bg, #2563eb);
    }
  </style>
</head>
<body>
  <header>
    <h1>实时车辆与会合</h1>
    <span id="status">加载地图组件…</span>
  </header>
  <div id="map"></div>
  <div class="panel" id="panel" style="display:none">
    <h2 id="panelTitle">会合列表</h2>
    <p class="hint" id="panelHint"></p>
    <div id="vehicleList"></div>
    <div id="meetingList"></div>
  </div>

  <script src="/web/map_boot.js"></script>
  <script>
    const MEETING_PALETTE = [
      { focal: '#2563eb', partner: '#0891b2', meet: '#ea580c' },
      { focal: '#7c3aed', partner: '#16a34a', meet: '#dc2626' },
      { focal: '#c2410c', partner: '#0d9488', meet: '#9333ea' },
      { focal: '#be123c', partner: '#ca8a04', meet: '#0369a1' },
    ];

    let map;
    let basemapLayer;
    let layers;
    const statusEl = document.getElementById('status');
    const panel = document.getElementById('panel');
    let lastSig = '';
    let lastState = null;
    let highlightIdx = -1;
    let mapMode = 'loading';
    let tileLabel = '';
    let tileHint = '';
    let basemapTimer = null;

    function scheduleRoadReload(delayMs, bbox) {
      if (mapMode !== 'roads') return;
      if (basemapTimer) clearTimeout(basemapTimer);
      basemapTimer = setTimeout(() => reloadRoads(bbox), delayMs == null ? 300 : delayMs);
    }

    async function reloadRoads(bboxOpt) {
      if (!map || !basemapLayer || mapMode !== 'roads') return;
      try {
        const meta = await MapBoot.loadRoadFallback(map, basemapLayer, {
          bbox: bboxOpt || MapBoot.boundsQuery(map.getBounds(), 0.18),
        });
        tileLabel = `${meta.label} · ${meta.features}条`;
        tileHint = meta.truncated ? '区域较大，部分路网未显示' : '';
        if (lastState) renderStatus(lastState);
      } catch (e) {
        tileLabel = '离线路网加载失败';
        tileHint = e.message;
        if (lastState) renderStatus(lastState);
      }
    }

    function renderStatus(state) {
      const nV = (state.vehicles || []).length;
      const nM = (state.meetings || []).filter(m => m.found).length;
      const nA = (state.arrivals || []).length;
      const focal = state.focal || '-';
      const extra = [tileLabel, tileHint].filter(Boolean).join(' · ');
      const updated = state.updatedAt
        ? new Date(state.updatedAt).toLocaleTimeString()
        : '-';
      let summary;
      if (state.mode === 'arrival') {
        const dest = state.destination || {};
        const by = dest.arriveBy || '-';
        const sortLabel = state.sortBy || 'duration';
        summary = `车辆 ${nV} 辆 · 可按时到达 ${nA} 辆 · 截止 ${by} · 排序 ${sortLabel} · 更新 ${updated}`;
      } else {
        const modeLabel = state.mode === 'batch' ? '批量会合' : '单车';
        summary = `车辆 ${nV} 辆 · 会合 ${nM} 组 · 基准 ${focal} · ${modeLabel} · 更新 ${updated}`;
      }
      statusEl.textContent = summary + (extra ? ` · ${extra}` : '');
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /** 按文字估算标记宽高，避免 iconSize=0 裁切 */
    function badgeDimensions(label, opts) {
      const kind = opts.kind || 'vehicle';
      const lines = Array.isArray(label) ? label : [String(label)];
      const longest = Math.max(...lines.map(l => l.length), 1);
      const minW = kind === 'dest' ? 88 : kind === 'meet' ? 80 : 76;
      const hasCjk = /[\u4e00-\u9fff\u3400-\u4dbf]/.test(longest);
      const charW = hasCjk ? (kind === 'meet' ? 12 : 13) : kind === 'meet' ? 7.2 : 8;
      const w = Math.ceil(Math.min(200, Math.max(minW, longest * charW + 28)));
      const lineCount = lines.length;
      const h = kind === 'dest'
        ? 46
        : lineCount > 1
          ? 28 + lineCount * 16
          : 32;
      return { w, h };
    }

    function mapBadgeIcon(label, color, opts) {
      const kind = opts.kind || 'vehicle';
      const withPin = opts.pin !== false && (kind === 'dest' || kind === 'meet');
      const lines = Array.isArray(label) ? label : [String(label)];
      const { w, h } = badgeDimensions(lines, { kind });
      const extraClass =
        kind === 'dest' ? ' map-badge-label--dest' : kind === 'meet' ? ' map-badge-label--meet' : '';
      let body;
      if (lines.length > 1) {
        const inner = lines
          .map((line, i) =>
            i === 0 ? escapeHtml(line) : `<div class="map-badge-sub">${escapeHtml(line)}</div>`
          )
          .join('');
        body = `<div class="map-badge-label${extraClass}" style="--badge-bg:${color}">${inner}</div>`;
      } else {
        body = `<div class="map-badge-label${extraClass}" style="--badge-bg:${color}">${escapeHtml(lines[0])}</div>`;
      }
      const pin = withPin ? `<div class="map-badge-pin" style="--badge-bg:${color}"></div>` : '';
      const pinH = withPin ? 12 : 0;
      return L.divIcon({
        className: 'map-marker-wrap',
        html: `<div class="map-badge">${body}${pin}</div>`,
        iconSize: [w, h + pinH],
        iconAnchor: [w / 2, h + pinH],
      });
    }

    function vehicleIcon(label, color) {
      return mapBadgeIcon(label, color, { kind: 'vehicle', pin: false });
    }

    function meetIcon(label, color, opts) {
      const focal = opts && opts.focal;
      const partner = opts && opts.partner;
      let text = label;
      if (focal && partner) {
        const combined = `${focal} ↔ ${partner}`;
        text = combined.length > 16 ? [focal, `↔ ${partner}`] : combined;
      }
      return mapBadgeIcon(text, color, { kind: 'meet', pin: true });
    }

    function destinationIcon() {
      return mapBadgeIcon('目的地', '#b91c1c', { kind: 'dest', pin: true });
    }

    function latLngs(route) {
      if (!Array.isArray(route)) return [];
      return route.filter(p => Array.isArray(p) && p.length >= 2).map(p => [p[0], p[1]]);
    }

    function fmtKm(m) {
      if (m == null || Number.isNaN(m)) return '-';
      return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';
    }

    function renderPanel(state) {
      const focal = state.focal || '';
      const vehicles = state.vehicles || [];
      const meetings = (state.meetings || []).filter(m => m.found);
      const arrivals = state.arrivals || [];
      const dest = state.destination || {};

      if (state.mode === 'arrival') {
        document.getElementById('panelTitle').textContent = '目的地到达排序';
        document.getElementById('panelHint').textContent =
          `目的地 (${dest.lat != null ? dest.lat.toFixed(4) : '-'}, ${dest.lon != null ? dest.lon.toFixed(4) : '-'}) · ` +
          `须在 ${dest.arriveBy || '-'} 前到达 · 排序：${state.sortBy || 'duration'}`;
        panel.style.display = 'block';
        const vList = document.getElementById('vehicleList');
        vList.innerHTML = vehicles.map(v => {
          const rank = arrivals.findIndex(a => a.vehicleId === v.id);
          const tag = rank >= 0 ? ` #${rank + 1} 可到达` : ' 无法按时到达';
          const color = rank >= 0 ? '#ea580c' : '#94a3b8';
          return `<div class="veh-row" style="border-color:${color}">
            <b>${v.id}</b>${tag}<br>速度 ${v.speed ?? '-'} km/h
          </div>`;
        }).join('');
        const mList = document.getElementById('meetingList');
        if (arrivals.length === 0) {
          mList.innerHTML = '<div class="meta">无车辆能在截止时间前到达</div>';
          return;
        }
        mList.innerHTML = arrivals.map((row, idx) => {
          const pal = MEETING_PALETTE[idx % MEETING_PALETTE.length];
          const dur = row.travelDurationSec != null ? row.travelDurationSec.toFixed(0) + ' 秒' : '-';
          const eta = row.eta || '-';
          return `<div class="meet-item" data-idx="${idx}" style="border-color:${pal.focal}">
            <div class="title">#${idx + 1} ${row.vehicleId}</div>
            <div class="meta">行程 ${dur} · 预计到达 ${eta}</div>
            <div class="meta">路网 ${fmtKm(row.routeDistanceM)}</div>
          </div>`;
        }).join('');
        mList.querySelectorAll('.meet-item').forEach(el => {
          el.addEventListener('click', () => {
            highlightIdx = Number(el.dataset.idx);
            render(lastState);
          });
        });
        return;
      }

      document.getElementById('panelTitle').textContent = focal ? `基准车 ${focal}` : '会合列表';
      document.getElementById('panelHint').textContent =
        state.mode === 'batch'
          ? '批量接口：每组是「基准车 ↔ 对方车」的会合，不是对方车之间会合。'
          : '单车接入：与车队最快会合的一组。';
      panel.style.display = 'block';

      const vList = document.getElementById('vehicleList');
      vList.innerHTML = vehicles.map(v =>
        `<div class="veh-row" style="border-color:${v.id === focal ? '#2563eb' : '#16a34a'}">
          <b>${v.id}</b>${v.id === focal ? ' (基准)' : ''}<br>
          速度 ${v.speed ?? '-'} km/h
        </div>`
      ).join('');

      const mList = document.getElementById('meetingList');
      if (meetings.length === 0) {
        mList.innerHTML = '<div class="meta">暂无会合结果</div>';
        return;
      }
      mList.innerHTML = meetings.map((mt, idx) => {
        const pal = MEETING_PALETTE[idx % MEETING_PALETTE.length];
        const ds = fmtKm(mt.routeDistanceSelfM);
        const dp = fmtKm(mt.routeDistancePartnerM);
        const dur = mt.meetDurationSec != null ? mt.meetDurationSec.toFixed(0) + ' 秒' : '-';
        return `<div class="meet-item" data-idx="${idx}" style="border-color:${pal.meet}">
          <div class="title">${focal} ↔ ${mt.partner}</div>
          <div class="meta">耗时 ${dur} · 路程 ${ds} / ${dp}</div>
          <div class="meta" style="color:#888">${focal} 与对方到会合点的路网距离</div>
        </div>`;
      }).join('');

      mList.querySelectorAll('.meet-item').forEach(el => {
        el.addEventListener('click', () => {
          highlightIdx = Number(el.dataset.idx);
          render(lastState);
        });
      });
    }

    function render(state) {
      lastState = state;
      layers.clearLayers();
      const bounds = [];
      const vehicles = state.vehicles || [];
      const meetings = (state.meetings || []).filter(m => m.found);
      const arrivals = state.arrivals || [];
      const dest = state.destination || {};
      const focal = state.focal || '';

      renderPanel(state);

      if (state.mode === 'arrival' && dest.lat != null && dest.lon != null) {
        const destMk = L.marker([dest.lat, dest.lon], {
          icon: destinationIcon(),
          zIndexOffset: 200,
        });
        destMk.bindPopup(
          `<b>目的地</b><br>须在 ${dest.arriveBy || '-'} 前到达<br>` +
          `可到达 ${arrivals.length} 辆车`
        );
        destMk.addTo(layers);
        bounds.push([dest.lat, dest.lon]);
      }

      vehicles.forEach(v => {
        if (v.lat == null || v.lon == null) return;
        const isFocal = v.id === focal;
        const rank = state.mode === 'arrival'
          ? arrivals.findIndex(a => a.vehicleId === v.id)
          : -1;
        let color = isFocal ? '#1e3a8a' : '#14532d';
        if (state.mode === 'arrival') {
          color = rank >= 0 ? '#c2410c' : '#64748b';
        }
        const m = L.marker([v.lat, v.lon], {
          icon: vehicleIcon(v.id, color),
          zIndexOffset: state.mode === 'arrival' && rank >= 0 ? 40 + rank : isFocal ? 30 : 10,
        });
        let popup = `<b>${escapeHtml(v.id)}</b>`;
        if (isFocal) popup += ' (基准车)';
        popup += `<br>速度 ${v.speed ?? '-'} km/h`;
        if (rank >= 0) popup += `<br>到达排序 #${rank + 1}`;
        m.bindPopup(popup);
        m.addTo(layers);
        bounds.push([v.lat, v.lon]);
      });

      meetings.forEach((mt, idx) => {
        const pal = MEETING_PALETTE[idx % MEETING_PALETTE.length];
        const dim = highlightIdx >= 0 && highlightIdx !== idx;
        const opacity = dim ? 0.2 : 0.9;
        const weight = dim ? 2 : 5;
        const partner = mt.partner || '';
        if (mt.lat != null && mt.lon != null) {
          const dur = mt.meetDurationSec != null ? `${mt.meetDurationSec.toFixed(0)} 秒` : '-';
          const meet = L.marker([mt.lat, mt.lon], {
            icon: meetIcon(null, pal.meet, { focal: focal || 'A', partner }),
            zIndexOffset: 100 + idx,
          });
          const label = `${focal || 'A'} ↔ ${partner}`;
          meet.bindPopup(
            `<b>${label} 会合点</b><br>` +
            `预计 ${dur}<br>` +
            `${focal} 路程 ${fmtKm(mt.routeDistanceSelfM)}<br>` +
            `${partner} 路程 ${fmtKm(mt.routeDistancePartnerM)}<br>` +
            `<small>优化目标：最早会合时间，非地理中点</small>`
          );
          meet.addTo(layers);
          bounds.push([mt.lat, mt.lon]);
        }

        const rs = latLngs(mt.routeSelf);
        const rp = latLngs(mt.routePartner);
        if (rs.length >= 2) {
          L.polyline(rs, { color: pal.focal, weight, opacity, dashArray: dim ? '4 6' : null }).addTo(layers);
          rs.forEach(p => bounds.push(p));
        }
        if (rp.length >= 2) {
          L.polyline(rp, { color: pal.partner, weight, opacity, dashArray: '8 5' }).addTo(layers);
          rp.forEach(p => bounds.push(p));
        }
      });

      if (state.mode === 'arrival') {
        arrivals.forEach((row, idx) => {
          const pal = MEETING_PALETTE[idx % MEETING_PALETTE.length];
          const dim = highlightIdx >= 0 && highlightIdx !== idx;
          const opacity = dim ? 0.25 : 0.88;
          const weight = dim ? 2 : 5;
          const pts = latLngs(row.route);
          if (pts.length >= 2) {
            L.polyline(pts, {
              color: pal.focal,
              weight,
              opacity,
              dashArray: dim ? '4 6' : null,
            }).addTo(layers);
            pts.forEach(p => bounds.push(p));
          }
        });
      }

      if (bounds.length > 0) {
        const lb = L.latLngBounds(bounds);
        map.fitBounds(lb, { padding: [50, 50], maxZoom: 14 });
        scheduleRoadReload(250, MapBoot.boundsQuery(lb, 0.22));
      }

      renderStatus(state);
    }

    async function poll() {
      try {
        const res = await fetch('/api/map/state');
        if (!res.ok) throw new Error(res.statusText);
        const state = await res.json();
        const sig = JSON.stringify(state);
        if (sig !== lastSig) {
          lastSig = sig;
          highlightIdx = -1;
          render(state);
        }
      } catch (e) {
        statusEl.textContent = '无法连接服务，请确认已运行 start_http_server.sh — ' + e.message;
      }
    }

    MapBoot.ready().then(async () => {
      map = MapBoot.createMap('map').setView([43.82, 87.60], 11);
      basemapLayer = L.layerGroup().addTo(map);
      layers = L.layerGroup().addTo(map);
      MapBoot.addScale(map);
      statusEl.textContent = '加载底图…';
      try {
        const base = await MapBoot.initBasemap(map, basemapLayer);
        mapMode = base.mode;
        tileLabel = base.label;
        tileHint = base.hint || '';
        if (mapMode === 'roads') {
          MapBoot.addRoadLegend(map);
          map.on('moveend', () => scheduleRoadReload(500));
        }
      } catch (e) {
        mapMode = 'roads';
        tileLabel = '底图初始化失败';
        tileHint = e.message;
      }
      statusEl.textContent = '连接数据…';
      poll();
      setInterval(poll, 2000);
    }).catch((e) => {
      statusEl.textContent = '地图组件加载失败：' + e.message + '（可运行 bash tools/fetch_web_vendor.sh）';
    });
  </script>
</body>
</html>
