<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMLP 路网预览</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: calc(100vh - 88px); width: 100%; }
    header {
      padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: #1a1a2e; color: #eee;
    }
    header label { font-size: 13px; }
    header select, header button { font-size: 13px; padding: 4px 8px; }
    .hint {
      width: 100%; font-size: 12px; color: #9ab; margin: 0;
      padding: 0 0 4px 0;
    }
    .legend { background: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
    .legend span { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; }
    .road { background: #2563eb; }
    .rail { background: #dc2626; }
    #status { font-size: 12px; color: #ccc; flex: 1; min-width: 200px; }
  </style>
</head>
<body>
  <header>
    <p class="hint">须先在本机运行：<code>bash tools/serve_map_viewer.sh</code>，再用下面地址打开（不要用 file://）</p>
    <label>区域
      <select id="region"></select>
    </label>
    <label>图层
      <select id="layerMode">
        <option value="all">公路+铁路</option>
        <option value="road">仅公路</option>
        <option value="rail">仅铁路</option>
      </select>
    </label>
    <button type="button" id="reload">加载路网</button>
    <span id="status">准备中…</span>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // GeoJSON 与 index.html 同目录下的 data/（也兼容从仓库根目录启动服务）
    const REGIONS = [
      { name: '乌鲁木齐', paths: ['data/urumqi.geojson', '../data/graph/preview/urumqi.geojson'] },
      { name: '北京', paths: ['data/beijing.geojson', '../data/graph/preview/beijing.geojson'] },
      { name: '上海', paths: ['data/shanghai.geojson', '../data/graph/preview/shanghai.geojson'] },
      { name: '新疆西部', paths: ['data/xinjiang_west.geojson', '../data/graph/preview/xinjiang_west.geojson'] },
    ];

    const map = L.map('map', { preferCanvas: true }).setView([43.82, 87.60], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    L.control.scale({ metric: true }).addTo(map);

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = () => {
      const d = L.DomUtil.create('div', 'legend');
      d.innerHTML = '<div><span class="road"></span>公路</div><div><span class="rail"></span>铁路</div>';
      return d;
    };
    legend.addTo(map);

    let layer = null;
    const regionSel = document.getElementById('region');
    REGIONS.forEach((r, i) => {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = r.name;
      regionSel.appendChild(opt);
    });

    function styleFor(feature) {
      const t = feature.properties.type;
      return { color: t === 'rail' ? '#dc2626' : '#2563eb', weight: t === 'rail' ? 2 : 1.5, opacity: 0.85 };
    }

    function filterFeature(f) {
      const mode = document.getElementById('layerMode').value;
      return mode === 'all' || f.properties.type === mode;
    }

    async function fetchFirst(paths) {
      let lastErr = null;
      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (!res.ok) { lastErr = new Error(p + ' → ' + res.status); continue; }
          return await res.json();
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('no path');
    }

    async function loadRegion() {
      const status = document.getElementById('status');
      const idx = Number(regionSel.value);
      const region = REGIONS[idx];
      status.textContent = '加载 ' + region.name + ' …';
      if (layer) { map.removeLayer(layer); layer = null; }
      try {
        const geo = await fetchFirst(region.paths);
        const filtered = {
          type: 'FeatureCollection',
          features: geo.features.filter(filterFeature)
        };
        layer = L.geoJSON(filtered, {
          style: styleFor,
          onEachFeature: (f, l) => {
            const p = f.properties;
            l.bindPopup(`<b>${p.type}</b> #${p.id}<br>长度 ${p.length_m} m`);
          }
        }).addTo(map);
        if (layer.getBounds().isValid()) {
          map.fitBounds(layer.getBounds(), { padding: [20, 20] });
        }
        status.textContent = region.name + '：' + filtered.features.length.toLocaleString() + ' 条线（与底图 OSM 对照）';
      } catch (e) {
        status.textContent = '加载失败：' + e.message + '。请先 bash tools/export_preview_regions.sh';
      }
    }

    document.getElementById('reload').onclick = loadRegion;
    document.getElementById('layerMode').onchange = () => { if (layer) loadRegion(); };
    loadRegion();
  </script>
</body>
</html>
